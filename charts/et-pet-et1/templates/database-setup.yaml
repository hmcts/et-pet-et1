{{- if .Values.databaseSetup.enabled }}
{{- $setup := .Values.databaseSetup }}
{{- if (default "" .Values.base.environment.DOCKER_STATE) }}
{{- fail "databaseSetup requires base.environment.DOCKER_STATE to be empty: the Job owns migrations" }}
{{- end }}
{{- $pod := (include "hmcts.podtemplate.v6.tpl" .Subcharts.base | fromYaml).template }}
{{- $name := printf "%s-database-setup" .Release.Name }}
{{/* Preserve identity labels, but never let the Service select the Job pod. */}}
{{- $_ := set $pod.metadata.labels "app.kubernetes.io/name" $name }}
{{- $_ := set $pod.spec "restartPolicy" "Never" }}
{{- $container := index $pod.spec.containers 0 }}
{{- range $key := list "startupProbe" "readinessProbe" "livenessProbe" "ports" "lifecycle" }}
{{- $_ := unset $container $key }}
{{- end }}
{{- $tasks := list }}
{{- if $setup.create }}{{- $tasks = append $tasks "db:create" }}{{- end }}
{{- $tasks = append $tasks "db:migrate:with_data" }}
{{- if $setup.seed }}{{- $tasks = append $tasks "db:seed" }}{{- end }}
{{- $_ := set $container "command" (list "/bin/sh" "-ec") }}
{{- $_ := set $container "args" (list (printf "unset SOLID_QUEUE_IN_PUMA; export DISABLE_ADMIN=true; exec bin/rails %s" (join " " $tasks))) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    # Retain a failed Job for diagnostics; remove it on the next attempt.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ $setup.activeDeadlineSeconds }}
  template:
    {{- toYaml $pod | nindent 4 }}
{{- end }}
