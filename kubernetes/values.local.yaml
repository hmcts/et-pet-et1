# ET1 uses its existing startup script with shared local PostgreSQL.
# This file overrides the child's chart; the shared base chart stays unchanged.
global:
  environment: local
  enableKeyVaults: false

base:
  image: et-full-system-servers-et1:latest
  imagePullPolicy: Never
  # Use the same startup script as the application image.
  ingressHost: et1.k8s.orb.local
  ingressClass: et-local
  disableTraefikTls: false
  ingressAnnotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  aadIdentityName: ""
  useWorkloadIdentity: false
  saEnabled: false
  disableKeyVaults: true
  affinity:
    podAntiAffinity: {}
  autoscaling:
    enabled: false
  pdb:
    enabled: false
  environment:
    SECRET_KEY_BASE: local-kubernetes-only-not-a-real-secret-0123456789abcdef0123456789abcdef
    # Shared local database and support services.
    DB_HOST: postgres.et-full-system-infra.svc.cluster.local
    DB_PORT: "5432"
    DB_NAME: etdb
    DB_USERNAME: postgres
    DB_PASSWORD: local-only
    DB_SSL_MODE: disable
    ET_API_URL: http://et-local-api-base.et-full-system.svc.cluster.local/api/v2
    SMTP_HOSTNAME: mailpit.et-full-system-infra.svc.cluster.local
    SMTP_PORT: "1025"
    SMTP_USERNAME: doesntmatter
    SMTP_PASSWORD: doesntmatter
    GOVUK_NOTIFY_CUSTOM_URL: http://fake-services.et-full-system-infra.svc.cluster.local:9200
    GOVUK_NOTIFY_API_KEY_LIVE: fake-key-7fc24bc8-1938-1827-bed3-fb237f9cd5e7-c34b3015-02a1-4e01-b922-1ea21f331d4d
    SERVICE_NOW_EMAIL: local@example.invalid
    ROOT_URL: https://et1.k8s.orb.local
    SERVICE_FQDN: https://et1.k8s.orb.local
    SENDING_HOST: et1.k8s.orb.local
    SECRETS_PATH: ""
    # Existing run.sh creates, migrates and seeds the local database before starting Procfile.
    DOCKER_STATE: create
    DISABLE_AZURE_APP_INSIGHTS: "true"
